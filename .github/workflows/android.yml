# Builds the Port Stacker Deluxe launcher (android/) with the current game inside it, and puts it on the "launcher" release:
# (The repo history was started fresh on 2026-11-11; this workflow then rebuilt the launcher from it.)
#   https://github.com/christopherlunardi/port-stacker/releases/download/launcher/PortStacker.apk
# Game updates don't need this: the launcher downloads dist/ itself. This runs when the launcher changes (or by hand).
name: Android launcher
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Put the current game inside the app (played until the first download, and offline on a fresh install)
        run: |
          mkdir -p android/app/src/main/assets
          cp dist/stack-style.html android/app/src/main/assets/game.html
          cp dist/version.json android/app/src/main/assets/version.json
      - name: Put the play-log key in the app (from the repo secret; it is never in the code)
        env: { PLAYLOG_TOKEN: '${{ secrets.PLAYLOG_TOKEN }}' }
        run: |
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <string name="playlog_key" translatable="false">%s</string>\n  <string name="playlog_issue" translatable="false">1</string>\n</resources>\n' "$PLAYLOG_TOKEN" > android/app/src/main/res/values/playlog.xml
      - name: Build the app (version code = run number + 100, above the old stack-style repo's builds, so it installs over them)
        run: VERSION_CODE=$((GITHUB_RUN_NUMBER + 100)) gradle -p android assembleRelease --no-daemon
      - name: Publish to the launcher release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PortStacker.apk
          echo "{\"versionCode\": $((GITHUB_RUN_NUMBER + 100))}" > launcher.json  # the app compares this with its own versionCode to offer UPDATE APP
          gh release delete launcher -y --cleanup-tag || true
          gh release create launcher PortStacker.apk launcher.json --title "Port Stacker Deluxe launcher (Android)" --notes "Built from ${{ github.sha }}. Install once; the game updates itself." --prerelease
