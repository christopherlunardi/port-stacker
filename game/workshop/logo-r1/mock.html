<style>/*FONTS*/
:root{--paper:#F7ECDE;--pink:#FF48B0;--blue:#2656C4;--sky:#5EC3EC;--yel:#FFE200;--ind:#2A1B7A}
body{margin:0;background:#888}
.opt{width:1200px;height:675px;position:relative;overflow:hidden;background:var(--paper);margin-bottom:10px}
.opt::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .45  0 0 0 -1.4 1.05'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.tag{position:absolute;left:18px;bottom:12px;font:700 14px Oswald;letter-spacing:.2em;color:var(--ind);opacity:.5}
svg text{dominant-baseline:middle}
</style>

<script>
const s = document.getElementById('Esvg'), ns = 'http://www.w3.org/2000/svg', cols = ['#FF48B0', '#2656C4', '#FFE200', '#FF7A1A', '#5EC3EC'];
function row(word, y, w, h, fs) { const n = word.length, x0 = 600 - n * w / 2;
  [...word].forEach((ch, i) => { const g = document.createElementNS(ns, 'g'), x = x0 + i * w + ((i * 37) % 9) - 4, c = cols[(i * 3 + y) % cols.length], light = c === '#FFE200' || c === '#5EC3EC';
    g.innerHTML = `<rect x="${x + 4}" y="${y}" width="${w - 8}" height="${h}" rx="5" fill="${c}" stroke="#2A1B7A" stroke-width="5"/>` +
      [1, 2, 3].map(k => `<line x1="${x + 4 + k * (w - 8) / 4}" y1="${y + 8}" x2="${x + 4 + k * (w - 8) / 4}" y2="${y + h - 8}" stroke="#2A1B7A" stroke-opacity=".25" stroke-width="3"/>`).join('') +
      `<text x="${x + w / 2}" y="${y + h / 2 + 4}" font-family="AlfaSlab" font-size="${fs}" fill="${light ? '#2A1B7A' : '#F7ECDE'}" stroke="#2A1B7A" stroke-width="${light ? 0 : 3}" paint-order="stroke" text-anchor="middle">${ch}</text>`;
    s.appendChild(g); }); }
row('PORT', 90, 128, 120, 100); row('STACKER', 222, 128, 120, 100);
s.insertAdjacentHTML('beforeend', '<path d="M370,378 L830,378 L805,470 L395,470 Z" fill="#2A1B7A"/><text x="600" y="426" font-family="Yellowtail" font-size="84" fill="#FF48B0" text-anchor="middle" stroke="#2A1B7A" stroke-width="5" paint-order="stroke">Deluxe</text>');
</script>
